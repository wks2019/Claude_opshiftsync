# Netlify configuration for Chosen Workflow LXP

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Lighthouse audits run on the live deploy permalink after publish, so SSR
# and the ISR home page are audited as real users see them.
#
# Every path to audit must be listed explicitly. Supplying an audits array
# replaces the implicit "/" audit rather than adding to it.
#
# Thresholds are deliberately not set yet: establish a baseline over a few
# deploys first, then set them just under the observed scores.
#
# Do not enable fail_deploy_on_score_thresholds here. That switches the
# plugin to onPostBuild and statically serves the build output, which the
# plugin documents as unsupported for SSR/ISR sites. This project is both.
#
# No output_path: proxy.ts gates every path outside PUBLIC_PATHS, so a
# published HTML report just redirects to /login. Full reports are on the
# deploy detail page in the Netlify UI.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [[plugins.inputs.audits]]
    path = "/"

  [[plugins.inputs.audits]]
    path = "solutions"

  [[plugins.inputs.audits]]
    path = "pricing"

# Production context: env vars set in Netlify UI, never committed.
[context.production]
  environment = { NODE_VERSION = "22" }

[context.deploy-preview]
  environment = { NODE_VERSION = "22" }

[context.branch-deploy]
  environment = { NODE_VERSION = "22" }

# Security headers applied to every response.
# CSP is set here rather than in next.config so it covers static assets too.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
